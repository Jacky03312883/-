<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ff6f9f"><title>心動闖關大作戰 iPhone版</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif;color:#392a3d;background:linear-gradient(160deg,#fff5f9,#f4efff)}body{padding:14px}.app{max-width:650px;margin:auto}.hidden{display:none!important}.panel{background:rgba(255,255,255,.93);border-radius:28px;padding:20px;box-shadow:0 18px 50px rgba(88,48,100,.14)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 4px 12px;flex-wrap:wrap}.logo{font-weight:900;font-size:20px}.pill{background:#fff;padding:8px 11px;border-radius:999px;font-size:13px;font-weight:900;box-shadow:0 7px 18px rgba(80,50,90,.08)}.hero{text-align:center}.heart{font-size:68px;animation:pulse 1.3s infinite}@keyframes pulse{50%{transform:scale(1.08)}}h1{font-size:30px;line-height:1.1;margin:8px 0}h2{font-size:23px;margin:6px 0 8px}p{line-height:1.55;color:#86758b}.label{font-weight:900;margin:12px 0 6px}input{width:100%;font-size:16px;padding:14px;border:1px solid #eadfeb;border-radius:15px;background:#fff;outline:none}.btn{width:100%;border:0;border-radius:17px;padding:14px 16px;font-size:16px;font-weight:900;background:#fff;color:#392a3d;box-shadow:0 8px 18px rgba(80,50,90,.08);touch-action:manipulation}.primary{color:#fff;background:linear-gradient(135deg,#ff6f9f,#9b72ff);box-shadow:0 10px 24px rgba(200,90,160,.24)}.stage{background:#fffafd;border-radius:22px;padding:16px;margin-top:12px}.progress{height:11px;background:#eee4ef;border-radius:999px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff6f9f,#9b72ff);transition:width .25s}.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.pad{background:#fff;border-radius:20px;padding:12px;text-align:center;box-shadow:0 8px 20px rgba(80,50,90,.07)}.name{font-weight:900;margin-bottom:8px}.bigbtn{width:100%;height:126px;border:0;border-radius:20px;font-size:44px;background:linear-gradient(135deg,#ff83ae,#ff5f98);color:#fff;box-shadow:0 10px 22px rgba(255,95,152,.2);touch-action:manipulation}.bigbtn.purple{background:linear-gradient(135deg,#b392ff,#9268f5)}.count{font-size:30px;font-weight:1000;margin-top:7px}.status{background:#fff;border-radius:15px;padding:12px;margin-top:12px;font-weight:800;text-align:center}.timer{font-variant-numeric:tabular-nums;font-size:52px;font-weight:1000;text-align:center;margin:18px 0}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.card{aspect-ratio:1;border:0;border-radius:16px;background:linear-gradient(135deg,#ffdfea,#ece4ff);position:relative;font-size:30px;color:transparent;touch-action:manipulation}.card:after{content:"❤";position:absolute;inset:0;display:grid;place-items:center;color:#c08bb7;font-size:23px}.card.open,.card.done{background:#fff;color:#392a3d}.card.open:after,.card.done:after{display:none}.card.done{outline:2px solid #66ce9b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.final{text-align:center}.score{font-size:58px;font-weight:1000}.reward{background:linear-gradient(135deg,#fff0f6,#f2edff);padding:15px;border-radius:18px;margin-top:14px;line-height:1.6}.test{font-size:12px;color:#88788d;text-align:center;margin-top:10px}.ok{color:#2b9d68;font-weight:900}@media(max-width:430px){body{padding:10px}.panel{padding:16px}.bigbtn{height:110px}.timer{font-size:46px}.memory{gap:6px}}
</style></head><body><div class="app"><div class="top"><div class="logo">💗 心動闖關大作戰</div><div id="stageTop" class="pill hidden">1 / 3</div><div id="scoreTop" class="pill hidden">0 分</div></div>
<section id="start" class="panel"><div class="hero"><div class="heart">💞</div><h1>情侶雙人闖關</h1><p>專門重做成 iPhone 版。所有關卡都只需要一般點擊，不用雙指長按。</p></div><div class="label">玩家 1</div><input id="n1" placeholder="例如：Jacky"><div class="label">玩家 2</div><input id="n2" placeholder="例如：寶貝"><button id="startBtn" class="btn primary" style="margin-top:16px">開始闖關 💘</button><div id="jsTest" class="test">正在檢查 Safari 遊戲引擎…</div></section>
<section id="game" class="panel hidden"><div id="badge" class="pill" style="display:inline-block">關卡 1 / 3</div><h2 id="title">愛心接力</h2><p id="desc">兩個人輪流把自己的愛心點到 12 次。</p><div class="progress"><div id="progress" class="bar"></div></div>
<div id="s1" class="stage"><b>兩邊都達到 12 次就過關</b><div class="duo"><div class="pad"><div id="aName" class="name">玩家 1</div><button id="tapA" class="bigbtn">💗</button><div id="aCount" class="count">0 / 12</div></div><div class="pad"><div id="bName" class="name">玩家 2</div><button id="tapB" class="bigbtn purple">💜</button><div id="bCount" class="count">0 / 12</div></div></div><div id="st1" class="status">開始狂點你們各自的愛心！</div></div>
<div id="s2" class="stage hidden"><b>輪流挑戰：不要看數字，覺得接近 3 秒就按停</b><div id="turnName" class="status">玩家 1 先來</div><div id="timer" class="timer">0.00</div><button id="timerBtn" class="btn primary">開始計時</button><div class="duo"><div class="pad"><div id="timeAName" class="name">玩家 1</div><div id="timeA" class="count">--</div></div><div class="pad"><div id="timeBName" class="name">玩家 2</div><div id="timeB" class="count">--</div></div></div><div id="st2" class="status">兩個人都越接近 3.00 秒，分數越高。</div></div>
<div id="s3" class="stage hidden"><b>一起找出 6 組相同圖案</b><div id="memory" class="memory"></div><div id="st3" class="status">輪流翻牌，記住位置。</div></div>
<div id="actions" class="actions hidden"><button id="retryBtn" class="btn">重試</button><button id="nextBtn" class="btn primary">下一關</button></div></section>
<section id="final" class="panel final hidden"><div class="heart">🏆</div><h2>闖關完成！</h2><div id="finalScore" class="score">0 分</div><div id="stars" style="font-size:28px">⭐⭐⭐</div><p id="finalText"></p><div id="reward" class="reward"></div><div class="actions"><button id="againBtn" class="btn">重新玩</button><button id="rewardBtn" class="btn primary">再抽任務 🎲</button></div></section></div>
<script>
(function(){
var S={stage:1,score:0,n:['玩家 1','玩家 2']};
function el(id){return document.getElementById(id)}
function hide(id){el(id).classList.add('hidden')}
function showEl(id){el(id).classList.remove('hidden')}
function topbar(){el('stageTop').innerHTML='關卡 '+S.stage+' / 3';el('scoreTop').innerHTML=S.score+' 分';el('progress').style.width=((S.stage-1)*50)+'%'}
function addEvent(id,type,fn){el(id).addEventListener(type,fn,false)}
window.addEventListener('load',function(){el('jsTest').innerHTML='<span class="ok">✓ Safari 遊戲引擎正常</span>';});
addEvent('startBtn','click',function(){S.n[0]=el('n1').value.replace(/^\s+|\s+$/g,'')||'玩家 1';S.n[1]=el('n2').value.replace(/^\s+|\s+$/g,'')||'玩家 2';el('aName').innerHTML=S.n[0];el('bName').innerHTML=S.n[1];el('timeAName').innerHTML=S.n[0];el('timeBName').innerHTML=S.n[1];hide('start');showEl('game');showEl('stageTop');showEl('scoreTop');loadStage(1)});
function pass(points){S.score+=points;topbar();showEl('actions');el('nextBtn').innerHTML=S.stage===3?'看結果':'下一關'}
function loadStage(n){S.stage=n;topbar();hide('actions');if(n===1){showEl('s1');hide('s2');hide('s3');el('badge').innerHTML='關卡 1 / 3';el('title').innerHTML='愛心接力';el('desc').innerHTML='兩個人輪流狂點自己的愛心。';reset1()}else if(n===2){hide('s1');showEl('s2');hide('s3');el('badge').innerHTML='關卡 2 / 3';el('title').innerHTML='3 秒心電感應';el('desc').innerHTML='輪流憑感覺停在 3 秒，比誰更準。';reset2()}else{hide('s1');hide('s2');showEl('s3');el('badge').innerHTML='關卡 3 / 3';el('title').innerHTML='甜蜜記憶配對';el('desc').innerHTML='一起把所有圖案配對完成。';reset3()}}
var A=0,B=0,done1=false;function reset1(){A=0;B=0;done1=false;el('aCount').innerHTML='0 / 12';el('bCount').innerHTML='0 / 12';el('st1').innerHTML='開始狂點你們各自的愛心！'}
addEvent('tapA','click',function(){if(done1)return;if(A<12)A++;el('aCount').innerHTML=A+' / 12';check1()});addEvent('tapB','click',function(){if(done1)return;if(B<12)B++;el('bCount').innerHTML=B+' / 12';check1()});
function check1(){if(A>=12&&B>=12&&!done1){done1=true;el('st1').innerHTML='接力成功！+30 分';pass(30)}else{el('st1').innerHTML='目前總共 '+(A+B)+' / 24 次'}}
var timerRunning=false,startTime=0,ticker=null,turn=0,T=[null,null];function reset2(){if(ticker)clearInterval(ticker);timerRunning=false;turn=0;T=[null,null];el('timer').innerHTML='0.00';el('timerBtn').innerHTML='開始計時';el('timerBtn').disabled=false;el('turnName').innerHTML=S.n[0]+' 先來';el('timeA').innerHTML='--';el('timeB').innerHTML='--';el('st2').innerHTML='不要盯著數字看，靠感覺接近 3 秒就停。'}
addEvent('timerBtn','click',function(){if(!timerRunning){timerRunning=true;startTime=Date.now();el('timerBtn').innerHTML='停！';el('timer').innerHTML='•••';ticker=setInterval(function(){},100)}else{timerRunning=false;if(ticker)clearInterval(ticker);var sec=(Date.now()-startTime)/1000;T[turn]=sec;if(turn===0){el('timeA').innerHTML=sec.toFixed(2)+' s';turn=1;el('turnName').innerHTML='換 '+S.n[1];el('timerBtn').innerHTML='開始計時';el('timer').innerHTML='0.00'}else{el('timeB').innerHTML=sec.toFixed(2)+' s';el('timerBtn').disabled=true;score2()}}});
function score2(){var e1=Math.abs(T[0]-3),e2=Math.abs(T[1]-3),sum=e1+e2,p=sum<=.5?40:sum<=1.2?30:20;el('timer').innerHTML='💞';el('st2').innerHTML='你們離 3 秒的總誤差 '+sum.toFixed(2)+' 秒，+'+p+' 分';pass(p)}
var icons=['💗','💜','💋','🌹','🧸','🍓'],mem={first:null,second:null,lock:false,match:0,tries:0};function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function reset3(){mem={first:null,second:null,lock:false,match:0,tries:0};var a=shuffle(icons.concat(icons)),g=el('memory');g.innerHTML='';for(var i=0;i<a.length;i++){var b=document.createElement('button');b.className='card';b.innerHTML=a[i];b.setAttribute('data-v',a[i]);b.addEventListener('click',flip,false);g.appendChild(b)}el('st3').innerHTML='輪流翻牌，記住位置。'}
function flip(e){var c=e.currentTarget;if(mem.lock||c.classList.contains('open')||c.classList.contains('done'))return;c.classList.add('open');if(!mem.first){mem.first=c;return}mem.second=c;mem.lock=true;mem.tries++;if(mem.first.getAttribute('data-v')===mem.second.getAttribute('data-v')){mem.first.className='card done';mem.second.className='card done';mem.match++;mem.first=null;mem.second=null;mem.lock=false;el('st3').innerHTML='配對 '+mem.match+' / 6';if(mem.match===6){var p=mem.tries<=8?40:(mem.tries<=10?30:20);el('st3').innerHTML='全部完成！用了 '+mem.tries+' 次，+'+p+' 分';pass(p)}}else{setTimeout(function(){mem.first.classList.remove('open');mem.second.classList.remove('open');mem.first=null;mem.second=null;mem.lock=false},650)}}
addEvent('retryBtn','click',function(){loadStage(S.stage)});addEvent('nextBtn','click',function(){if(S.stage<3)loadStage(S.stage+1);else finish()});
var rewards=['抱抱 20 秒，中途不能放開。','互相說出 3 個最喜歡對方的小地方。','拍一張現在的合照，當作通關紀念。','這週安排一次甜點約會。','輪流說一句平常不好意思講的真心話。','下一次約會一起去一個沒去過的地方。'];function drawReward(){el('reward').innerHTML='<b>通關情侶任務</b><br>'+rewards[Math.floor(Math.random()*rewards.length)]}
function finish(){hide('game');showEl('final');el('finalScore').innerHTML=S.score+' 分';el('stars').innerHTML=S.score>=100?'⭐⭐⭐⭐⭐':S.score>=80?'⭐⭐⭐⭐':'⭐⭐⭐';el('finalText').innerHTML=S.score>=100?'你們這次配合超強。':S.score>=80?'默契很不錯，合作也很順。':'闖完就是勝利，再玩一次還能挑戰更高。';drawReward()}
addEvent('againBtn','click',function(){window.location.reload()});addEvent('rewardBtn','click',drawReward);
})();
</script></body></html>
