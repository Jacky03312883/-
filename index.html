<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ff6f9f" />
<title>心動闖關大作戰</title>
<style>
:root{--pink:#ff6f9f;--purple:#9b72ff;--text:#392a3d;--muted:#86758b;--card:rgba(255,255,255,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#ffd9e7 0,transparent 30%),radial-gradient(circle at 90% 15%,#e3d6ff 0,transparent 30%),linear-gradient(160deg,#fff7fa,#f7f2ff);user-select:none}body{padding:14px}.app{width:min(100%,720px);margin:auto}.hidden{display:none!important}.panel{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:30px;padding:22px;box-shadow:0 20px 60px rgba(84,45,100,.15)}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:2px 4px 12px;flex-wrap:wrap}.logo{font-weight:1000;font-size:20px}.pill{background:#fff;border-radius:999px;padding:9px 12px;font-weight:900;box-shadow:0 8px 20px rgba(70,40,80,.08);font-size:13px}.hero{text-align:center}.heart{font-size:70px;animation:beat 1.35s infinite}@keyframes beat{50%{transform:scale(1.08)}}h1{font-size:33px;line-height:1.08;margin:10px 0}h2{font-size:24px;margin:5px 0 10px}p{color:var(--muted);line-height:1.65}label{display:block;font-weight:900;margin:13px 0 7px}input{width:100%;padding:15px 16px;border:1px solid #eadfeb;border-radius:16px;font-size:16px;outline:none;background:#fff}.btn{width:100%;border:0;border-radius:18px;padding:15px 17px;font:inherit;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 12px 28px rgba(205,90,160,.25)}.ghost{background:#fff;color:var(--text);box-shadow:0 8px 20px rgba(70,40,80,.08)}.badge{display:inline-block;background:#f4edf8;color:#735b79;font-weight:900;font-size:13px;border-radius:999px;padding:8px 11px}.progress{height:12px;border-radius:999px;background:#ece2ef;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));transition:.25s}.stage{background:rgba(255,255,255,.72);border-radius:24px;padding:18px;margin-top:12px}.duo{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}.pad{background:#fff;padding:13px;border-radius:22px;text-align:center;box-shadow:0 10px 24px rgba(70,40,80,.07)}.name{font-weight:900;margin-bottom:9px}.tap{width:100%;min-height:135px;border:0;border-radius:23px;font-size:46px;font-weight:1000;color:#fff;background:linear-gradient(135deg,#ff87ae,#ff5f98);box-shadow:0 12px 25px rgba(255,95,152,.25)}.tap.purple{background:linear-gradient(135deg,#b594ff,#9065f5);box-shadow:0 12px 25px rgba(150,100,245,.22)}.meter{height:19px;background:#eee5f0;border-radius:999px;overflow:hidden;margin:14px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff76a5,#9b72ff);transition:.05s}.status{margin-top:14px;background:#fff;border-radius:16px;padding:12px 14px;font-weight:800;box-shadow:0 8px 18px rgba(70,40,80,.06)}.light{width:min(52vw,210px);height:min(52vw,210px);margin:16px auto;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:1000;background:#e8e0ef;color:#8f7b9d;box-shadow:inset 0 0 0 8px rgba(255,255,255,.6)}.light.go{background:radial-gradient(circle at 35% 30%,#fff6b6,#ffc846);color:#704a00;box-shadow:0 0 40px rgba(255,200,70,.45),inset 0 0 0 8px rgba(255,255,255,.6)}.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}.time{background:#fff;padding:13px;border-radius:16px;text-align:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.card{aspect-ratio:1;border:0;border-radius:17px;background:linear-gradient(135deg,#ffdfeb,#eee5ff);font-size:31px;color:transparent;position:relative;box-shadow:0 8px 18px rgba(70,40,80,.07)}.card:after{content:"❤";position:absolute;inset:0;display:grid;place-items:center;color:#bf8cb7;font-size:24px}.card.open,.card.done{background:#fff;color:#33253a}.card.open:after,.card.done:after{display:none}.card.done{outline:2px solid #71d3a2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.final{text-align:center}.score{font-size:58px;font-weight:1000;margin:8px 0}.reward{margin-top:16px;border-radius:20px;background:linear-gradient(135deg,#fff0f6,#f3edff);padding:16px;line-height:1.7}@media(max-width:520px){.panel{padding:18px}.duo{grid-template-columns:1fr}.tap{min-height:112px}.grid{gap:7px}h1{font-size:29px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">💗 心動闖關大作戰</div><div id="stageTop" class="pill hidden">關卡 1 / 3</div><div id="scoreTop" class="pill hidden">0 分</div></div>
<section id="start" class="panel"><div class="hero"><div class="heart">💞</div><h1>情侶雙人闖關小遊戲</h1><p>不是一直回答問題，而是一起合作破關。<br>同一支手機就能玩。</p></div><label>玩家 1</label><input id="n1" placeholder="例如：Jacky"><label>玩家 2</label><input id="n2" placeholder="例如：寶貝"><button class="btn primary" style="margin-top:18px" onclick="startGame()">開始戀愛闖關 💘</button></section>
<section id="game" class="panel hidden"><div class="badge" id="badge">關卡 1 / 3</div><h2 id="title">同步愛心</h2><p id="desc">兩個人一起長按，將愛心能量充滿。</p><div class="progress"><div id="progress" class="bar"></div></div>
<div id="s1" class="stage"><b>目標：兩個人同時長按，把能量充到 100%</b><div class="meter"><div id="energy" class="fill"></div></div><div class="duo"><div class="pad"><div id="nameA" class="name">玩家 1</div><button id="holdA" class="tap">💗</button></div><div class="pad"><div id="nameB" class="name">玩家 2</div><button id="holdB" class="tap purple">💜</button></div></div><div id="st1" class="status">準備好就一起按住！</div></div>
<div id="s2" class="stage hidden"><b>目標：燈亮後一起按，兩人時間差小於 250ms</b><div id="light" class="light">⏳</div><button id="reactionStart" class="btn ghost" onclick="startReaction()">開始這一關</button><div class="duo"><div class="pad"><div id="rA" class="name">玩家 1</div><button class="tap" onclick="react(1)">拍！</button></div><div class="pad"><div id="rB" class="name">玩家 2</div><button class="tap purple" onclick="react(2)">拍！</button></div></div><div class="times"><div id="t1" class="time">--</div><div id="t2" class="time">--</div></div><div id="st2" class="status">按開始後，等燈亮。</div></div>
<div id="s3" class="stage hidden"><b>目標：一起找出全部 6 組配對</b><div id="memory" class="grid"></div><div id="st3" class="status">輪流翻牌，記住位置。</div></div>
<div id="actions" class="actions hidden"><button class="btn ghost" onclick="retry()">重試</button><button id="next" class="btn primary" onclick="nextStage()">下一關</button></div></section>
<section id="final" class="panel final hidden"><div class="heart">🏆</div><h2>闖關成功！</h2><div id="finalScore" class="score">0</div><div id="stars" style="font-size:30px">⭐⭐⭐</div><p id="finalText"></p><div id="reward" class="reward"></div><div class="actions"><button class="btn ghost" onclick="location.reload()">重新玩</button><button class="btn primary" onclick="reward()">再抽任務 🎲</button></div></section>
</div>
<script>
let S={stage:1,score:0,n:['玩家 1','玩家 2']};
const $=id=>document.getElementById(id);
function startGame(){S.n=[$('n1').value.trim()||'玩家 1',$('n2').value.trim()||'玩家 2'];$('nameA').textContent=S.n[0];$('nameB').textContent=S.n[1];$('rA').textContent=S.n[0];$('rB').textContent=S.n[1];$('start').classList.add('hidden');$('game').classList.remove('hidden');$('stageTop').classList.remove('hidden');$('scoreTop').classList.remove('hidden');show(1)}
function top(){ $('stageTop').textContent=`關卡 ${S.stage} / 3`; $('scoreTop').textContent=`${S.score} 分`; $('progress').style.width=`${(S.stage-1)*50}%` }
function pass(p){S.score+=p;top();$('actions').classList.remove('hidden');$('next').textContent=S.stage===3?'看結果':'下一關'}
function show(n){S.stage=n;top();$('actions').classList.add('hidden');['s1','s2','s3'].forEach((x,i)=>$(x).classList.toggle('hidden',i!==n-1));if(n===1){$('badge').textContent='關卡 1 / 3';$('title').textContent='同步愛心';$('desc').textContent='兩個人一起長按，把愛心能量充滿。';reset1()}if(n===2){$('badge').textContent='關卡 2 / 3';$('title').textContent='默契反應';$('desc').textContent='等燈亮後一起按，看你們到底有多同步。';reset2()}if(n===3){$('badge').textContent='關卡 3 / 3';$('title').textContent='甜蜜記憶配對';$('desc').textContent='一起找出所有配對圖案。';reset3()}}
function nextStage(){S.stage<3?show(S.stage+1):finish()}function retry(){show(S.stage)}
let H={a:false,b:false,v:0,t:null,done:false};function reset1(){if(H.t)clearInterval(H.t);H={a:false,b:false,v:0,t:null,done:false};$('energy').style.width='0%';$('st1').textContent='準備好就一起按住！'}
function hold(n,on){if(H.done)return;n===1?H.a=on:H.b=on;if(!H.t)H.t=setInterval(()=>{let d=H.a&&H.b?2.7:(H.a||H.b?.5:-.3);if(!(H.a||H.b))d=-.3;H.v=Math.max(0,Math.min(100,H.v+d));$('energy').style.width=H.v+'%';$('st1').textContent=H.a&&H.b?'很同步！繼續按住！':'兩個人一起按會更快';if(H.v>=100){H.done=true;clearInterval(H.t);H.t=null;$('st1').textContent='過關！同步愛心成功 +30 分';pass(30)}},60)}
[['holdA',1],['holdB',2]].forEach(([id,n])=>{let b=$(id);b.addEventListener('pointerdown',()=>hold(n,true));['pointerup','pointercancel','pointerleave'].forEach(e=>b.addEventListener(e,()=>hold(n,false)))})
let R={run:false,go:null,a:null,b:null,t:null};function reset2(){if(R.t)clearTimeout(R.t);R={run:false,go:null,a:null,b:null,t:null};$('light').className='light';$('light').textContent='⏳';$('t1').textContent='--';$('t2').textContent='--';$('st2').textContent='按開始後，等燈亮。';$('reactionStart').disabled=false}
function startReaction(){reset2();R.run=true;$('reactionStart').disabled=true;$('st2').textContent='不要太早按！';R.t=setTimeout(()=>{R.go=performance.now();$('light').classList.add('go');$('light').textContent='GO'},1400+Math.random()*2200)}
function react(n){if(!R.run)return;if(!R.go){clearTimeout(R.t);R.run=false;$('light').textContent='❌';$('st2').textContent='太早按了！按重試再來一次。';$('actions').classList.remove('hidden');return}let rt=Math.round(performance.now()-R.go);if(n===1&&R.a===null){R.a=rt;$('t1').textContent=rt+' ms'}if(n===2&&R.b===null){R.b=rt;$('t2').textContent=rt+' ms'}if(R.a!==null&&R.b!==null){R.run=false;let d=Math.abs(R.a-R.b),p=d<=120?40:d<=250?30:d<=420?20:0;$('st2').textContent=p?`時間差 ${d} ms，過關 +${p} 分`:`時間差 ${d} ms，差一點，重試看看`;if(p)pass(p);else $('actions').classList.remove('hidden')}}
const E=['💗','💜','💋','🌹','🧸','🍓'];let M={first:null,second:null,lock:false,match:0,try:0};function reset3(){M={first:null,second:null,lock:false,match:0,try:0};let a=[...E,...E].sort(()=>Math.random()-.5),g=$('memory');g.innerHTML='';a.forEach(v=>{let b=document.createElement('button');b.className='card';b.textContent=v;b.dataset.v=v;b.onclick=()=>flip(b);g.appendChild(b)});$('st3').textContent='輪流翻牌，記住位置。'}
function flip(c){if(M.lock||c.classList.contains('open')||c.classList.contains('done'))return;c.classList.add('open');if(!M.first){M.first=c;return}M.second=c;M.lock=true;M.try++;if(M.first.dataset.v===M.second.dataset.v){M.first.className='card done';M.second.className='card done';M.match++;M.first=M.second=null;M.lock=false;$('st3').textContent=`配對成功 ${M.match}/6`;if(M.match===6){let p=M.try<=8?40:M.try<=10?30:20;$('st3').textContent=`全部完成！用了 ${M.try} 次 +${p} 分`;pass(p)}}else setTimeout(()=>{M.first.classList.remove('open');M.second.classList.remove('open');M.first=M.second=null;M.lock=false},650)}
const rewards=['抱抱 20 秒，中途不能放開。','互相說出 3 個最喜歡對方的小地方。','拍一張現在的合照當作通關紀念。','這週安排一次甜點約會。','輪流說一句平常不好意思講的真心話。','下一次約會一起去一個沒去過的地方。'];function reward(){$('reward').innerHTML='<b>通關情侶任務</b><br>'+rewards[Math.floor(Math.random()*rewards.length)]}
function finish(){$('game').classList.add('hidden');$('final').classList.remove('hidden');$('finalScore').textContent=S.score+' 分';let st=S.score>=95?'⭐⭐⭐⭐⭐':S.score>=75?'⭐⭐⭐⭐':S.score>=55?'⭐⭐⭐':'⭐⭐';$('stars').textContent=st;$('finalText').textContent=S.score>=95?'你們同步到有點誇張。':S.score>=75?'很有默契，合作感也很好。':S.score>=55?'不錯，再挑戰一次有機會更高。':'今天先當作熱身，下次再拚更高。';reward()}
</script>
</body></html>
